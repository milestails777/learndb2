services:
  web:
    build: 
      context: .
      dockerfile: dockerfile
    ports:
      - 9000:80
    volumes:
      - ./html:/usr/local/apache2/htdocs

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cinema_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  cinema_postgres_data:
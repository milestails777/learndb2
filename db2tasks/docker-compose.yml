services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - 9000:80
    volumes:
      - ./html:/usr/local/apache2/htdocs

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: project
    volumes:
      - ta24blearndb2dbdata:/var/lib/mysql
    ports:
      - 33061:3306
  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
volumes:
  ta24blearndb2dbdata:
